# Ground-truth cases for measuring Argus's recall and false-positive rate (PLAN.md, Evaluation corpus).
#
# Two kinds of entry:
#   local  a fixture already in this repo (tests/fixtures/...). Fast, offline, always available; used to
#          keep the harness itself honest and to seed the corpus before real-world cases are collected.
#   git    a real repository at a specific commit, with the file/function/rule Argus should find there.
#          This is the kind that actually answers "is Argus good on real code" -- add these as you find
#          them. `commit` is the commit BEFORE the fix, i.e. the one that still has the bug.
#
# `expected`: findings Argus's static map must produce. A hit needs rule + function + file to match; `line`
# is optional and only checked when given (numbers drift as a file changes, function identity doesn't).
# `must_be_absent`: specific (rule, function) pairs that must NOT appear -- a targeted false-positive check
# for cases where a naive version of a rule would misfire (offloaded calls, configured timeouts, etc.).
#
# Run: python tests/eval/run.py

cases:
  - id: rust_trader-blocking-http
    kind: local
    path: tests/fixtures/rust_trader
    lang: rust
    note: >-
      Synthetic (not mined from a real repo's history -- see the note in run.py about why real `git` cases
      aren't populated yet). A synchronous reqwest::blocking call reachable from an async path: the exact
      shape of the bug this project exists for.
    expected:
      - {rule: blocking-in-async, function: "rust_trader::main", file: src/main.rs, line: 15}
      - {rule: blocking-in-async, function: "rust_trader::strategy::run_strategy", file: src/strategy.rs, line: 20}
      - {rule: io-in-loop, function: "rust_trader::market_data::refresh_all", file: src/market_data.rs, line: 20}
      - {rule: recursion, function: "rust_trader::risk::exposure", file: src/risk.rs, line: 6}
      - {rule: nested-loops, function: "rust_trader::risk::correlation_matrix", file: src/risk.rs, line: 14}

  - id: orderdesk-seeded-service
    kind: local
    path: tests/fixtures/orderdesk
    lang: python
    note: >-
      Synthetic but realistic FastAPI service: 22 seeded defects across Argus's Python rules, written with no
      hint comments, plus 13 decoys (correct code shaped like a bug). A plain LLM audit prompt found 21/22 of
      the seeds on this repo, so it is the bar the static map has to clear. Most misses here are resolution
      gaps: timeouts and retry counts held in settings constants, I/O reached through asyncio.to_thread,
      methods called on module-level instances, patterns outside function bodies.
    expected:
      - {rule: blocking-in-async, function: "shop.services.orders.OrderService.build_quote", file: shop/services/orders.py}
      - {rule: blocking-in-async, function: "shop.services.orders.OrderService._reserve_and_price", file: shop/services/orders.py}
      - {rule: io-without-timeout, function: "shop.clients.pricing.PricingClient.price_for", file: shop/clients/pricing.py}
      - {rule: hang-reaches-entry, function: "shop.api.quote", file: shop/api.py}
      - {rule: deadline-cannot-preempt, function: "shop.services.orders.OrderService.checkout", file: shop/services/orders.py}
      - {rule: timeout-budget-exceeded, function: "shop.api.stock", file: shop/api.py}
      - {rule: retry-amplification, function: "shop.worker.replay_pending", file: shop/worker.py}
      - {rule: unbounded-retry, function: "shop.worker.price_feed_loop", file: shop/worker.py}
      - {rule: backoff-without-jitter, function: "shop.clients.inventory.InventoryClient._request", file: shop/clients/inventory.py}
      - {rule: io-in-loop, function: "shop.services.orders.OrderService.order_summary", file: shop/services/orders.py}
      - {rule: io-in-loop, function: "shop.services.orders.OrderService.reserve_items", file: shop/services/orders.py}
      - {rule: io-in-loop, function: "shop.clients.pricing.PricingClient.quote", file: shop/clients/pricing.py}
      - {rule: lock-across-await, function: "shop.cache.TTLCache.get_or_load", file: shop/cache.py}
      - {rule: fire-and-forget-task, function: "shop.services.orders.OrderService._reserve_and_price", file: shop/services/orders.py}
      - {rule: unbounded-channel, function: "shop.services.events.EventBus.__init__", file: shop/services/events.py}
      - {rule: cpu-heavy-in-async, function: "shop.services.auth.login", file: shop/services/auth.py}
      - {rule: float-money, function: "shop.money.line_total", file: shop/money.py}
      - {rule: wallclock-interval, function: "shop.ratelimit.Throttle.wait", file: shop/ratelimit.py}
      - {rule: blocking-in-async, function: "shop.api.quote", file: shop/api.py}
      - {rule: nested-loops, function: "shop.services.catalog.related_products", file: shop/services/catalog.py}
      - {rule: recursion, function: "shop.services.catalog.category_path", file: shop/services/catalog.py}
      - {rule: unbounded-query, function: "shop.db.all_orders", file: shop/db.py}
      - {rule: blocking-in-async, function: "shop.api.export_orders", file: shop/api.py}
      - {rule: sequential-awaits, function: "shop.api.product_page", file: shop/api.py}
      # outside the classic reliability rules, but patterns Argus has: SQL built by an f-string, a nested-quantifier regex
      - {rule: sql-injection, function: "shop.db.search_products", file: shop/db.py}
      - {rule: redos-regex, function: "shop.money.coupon_discount", file: shop/money.py}
    must_be_absent:
      # decoys: correct code shaped like a bug
      - {rule: io-without-timeout, function: "shop.clients.pricing.PricingClient._price_bounded"}
      - {rule: blocking-in-async, function: "shop.clients.pricing.PricingClient.price_for_async"}
      - {rule: io-in-loop, function: "shop.db.get_products"}
      - {rule: lock-across-await, function: "shop.clients.inventory.InventoryClient._auth_header"}
      - {rule: recursion, function: "shop.services.catalog.render_menu"}
      - {rule: io-in-loop, function: "scripts.seed_db.main"}
      - {rule: nested-loops, function: "shop.services.catalog.delivery_grid"}
      - {rule: io-in-loop, function: "shop.clients.reviews.fetch_reviews"}
      - {rule: backoff-without-jitter, function: "shop.clients.reviews.fetch_reviews"}
      - {rule: float-money, function: "shop.invoices.invoice_total"}
      - {rule: io-in-loop, function: "shop.db._query"}
      - {rule: unbounded-channel, function: "shop.services.events.AuditLog.__init__"}
      - {rule: io-in-loop, function: "shop.db.add_order_lines"}
      - {rule: io-in-loop, function: "shop.db.update_prices"}
      # misreadings seen on this repo: retry loops read as N+1 or O(n^2), delegation read as recursion
      - {rule: io-in-loop, function: "shop.clients.inventory.InventoryClient._request"}
      - {rule: nested-loops, function: "shop.services.orders.OrderService.reserve_items"}
      - {rule: nested-loops, function: "shop.worker.replay_pending"}
      - {rule: recursion, function: "shop.clients.inventory.InventoryClient.aclose"}
      - {rule: unbounded-query, function: "shop.db._query"}

  - id: py_runtime-nplusone-and-timeout
    kind: local
    path: tests/fixtures/py_runtime
    lang: python
    note: Synthetic. An N+1 fetch inside a loop and a call with no timeout, both in the same function.
    expected:
      - {rule: io-in-loop, function: "app.service.tick", file: app/service.py, line: 30}
      - {rule: io-without-timeout, function: "app.service.fetch_quote", file: app/service.py, line: 9}
    must_be_absent:
      # fetch_quote_bounded passes timeout=3: must not also be flagged
      - {rule: io-without-timeout, function: "app.service.fetch_quote_bounded"}

  - id: rust_runtime-verified-against-a-real-trace
    kind: local
    path: tests/fixtures/rust_runtime
    lang: rust
    note: >-
      The same static shape as rust_trader, but this one was also verified against a REAL `tracing-chrome`
      recording of the compiled, running binary (see test_trace_chrome_real.py), not just the static rule.
      Kept separate so the static and runtime sides of that case are each scored on their own.
    expected:
      - {rule: blocking-in-async, function: "rust_runtime::strategy::tick", file: src/strategy.rs, line: 13}
      - {rule: blocking-in-async, function: "rust_runtime::strategy::refresh_all", file: src/strategy.rs, line: 26}
      - {rule: io-in-loop, function: "rust_runtime::strategy::refresh_all", file: src/strategy.rs, line: 26}

  # Add real cases like this once a real bug has been found and the exact function name/file checked by
  # actually running `auditor_cli.py map` against that commit:
  # - id: <short-slug>
  #   kind: git
  #   repo: https://github.com/<org>/<repo>
  #   commit: <sha before the fix -- the one with the bug>
  #   fix_commit: <sha of the fix, documentation only, not used by the harness>
  #   lang: <language>
  #   note: <one line: what the fix commit's message/diff says, and a link if useful>
  #   expected:
  #     - {rule: ..., function: ..., file: ..., line: ...}
