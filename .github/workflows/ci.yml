name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # nightly: the eval job below, which clones real repos and is too slow for every push
  workflow_dispatch:

jobs:
  core:
    if: github.event_name != 'schedule'  # the nightly trigger is for the eval job only
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rust-analyzer, clippy"}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: npm install -g tsx
      - run: pip install -r plugins/argus/requirements.txt
      - run: python -m pytest tests -q -rs

  # Ground-truth recall/false-positive check (PLAN.md's evaluation corpus). Runs nightly and on demand,
  # not on every push: `kind: git` cases clone a real repository, which is slow and needs steady network
  # (this repo's own dev sandbox found large downloads flaky; a hosted runner should not have that problem).
  eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: evaluation corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r plugins/argus/requirements.txt -r tests/eval/requirements.txt
      - run: python tests/eval/run.py --json eval-summary.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: eval-summary, path: eval-summary.json}
