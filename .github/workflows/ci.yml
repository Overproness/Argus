name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rust-analyzer, clippy"}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: pip install -r plugins/argus/requirements.txt
      - run: python -m pytest tests -q -rs

  # One job per remaining toolchain: its fixtures run only when the toolchain is present, so a green job
  # here is what turns a language's matrix cell from "implemented" into "verified".
  toolchains:
    name: toolchain (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lang: ruby, setup: "ruby/setup-ruby@v1", with: "{\"ruby-version\": \"3.3\"}"}
          - {lang: php, setup: "shivammathur/setup-php@v2", with: "{\"php-version\": \"8.3\"}"}
          - {lang: kotlin, setup: "actions/setup-java@v4", with: "{\"distribution\": \"temurin\", \"java-version\": \"21\"}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: ${{ matrix.setup }}
        with: ${{ fromJSON(matrix.with) }}
      - run: pip install -r plugins/argus/requirements.txt
      - run: python -m pytest tests -q -rs -k "${{ matrix.lang }}"
